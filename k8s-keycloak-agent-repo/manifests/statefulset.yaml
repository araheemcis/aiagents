apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: k8s-keycloak-agent
  namespace: ai-agent-system
  labels:
    app: k8s-keycloak-agent
spec:
  serviceName: "k8s-keycloak-agent"
  replicas: 1
  selector:
    matchLabels:
      app: k8s-keycloak-agent
  template:
    metadata:
      labels:
        app: k8s-keycloak-agent
    spec:
      serviceAccountName: k8s-keycloak-agent-sa
      containers:
        - name: k8s-keycloak-agent
          image: araheemcis/k8s-keycloak-agent:v3.0.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: gmail-app-password
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: keycloak-admin-password