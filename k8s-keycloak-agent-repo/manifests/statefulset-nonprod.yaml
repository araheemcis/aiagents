apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: k8s-keycloak-agent-nonprod
  namespace: ai-agent-test
  labels:
    app: k8s-keycloak-agent-nonprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-keycloak-agent-nonprod
  serviceName: k8s-keycloak-agent-nonprod
  template:
    metadata:
      labels:
        app: k8s-keycloak-agent-nonprod
    spec:
      serviceAccountName: k8s-keycloak-agent-sa
      containers:
        - name: k8s-keycloak-agent
          image: araheemcis/k8s-keycloak-agent:feature-f895005
          imagePullPolicy: Always
          env:
            # Static Non-Prod Configuration
            - name: KEYCLOAK_URL
              value: "https://keycloak.keycloak.svc.cluster.local:8443/"
            - name: KEYCLOAK_REALM
              value: "k8s-realm"
            - name: KEYCLOAK_ADMIN_USER
              value: "admin"
            - name: KEYCLOAK_OIDC_URL
              value: "https://192.168.1.225:30281/realms/k8s-realm"
            - name: GMAIL_USER
              value: "itsmeabdul202@gmail.com"
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: EMAIL_SUBJECT_FILTER
              value: "K8s user deployment TEST"

            # Secret references mapped to exact keys in agent-secrets
            - name: KEYCLOAK_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: keycloak-admin-password
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: gmail-app-password